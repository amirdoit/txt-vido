name: Video Fetch Worker

on:
  pull_request:
    paths:
      - '.video-fetch/request.json'
  workflow_dispatch:
    inputs:
      url:
        description: 'Public video URL to fetch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch-video:
    # Public repository safety: trusted same-repo requests only. Fork PRs must
    # never receive cloud provider credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'amirdoit')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Primary cloud path. Apify actor runs YouTube downloads in Apify cloud
      # with residential proxy support and stores the resulting MP4 remotely.
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      # Secondary provider-neutral egress path. Optional. Initial recommended
      # implementation if needed later: a sticky Decodo residential proxy URL.
      VIDEO_RESIDENTIAL_PROXY_URL: ${{ secrets.VIDEO_RESIDENTIAL_PROXY_URL }}

      # Optional final fallback for genuinely login-gated YouTube content.
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

    steps:
      - name: Check out trusted request branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve request
        id: request
        shell: bash
        env:
          DISPATCH_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_URL:-}" ]]; then
            URL="$DISPATCH_URL"
          else
            URL="$(python - <<'PY'
          import json
          print(json.load(open('.video-fetch/request.json'))['url'])
          PY
          )"
          fi
          [[ "$URL" =~ ^https?:// ]] || { echo 'Refusing non-HTTP(S) URL' >&2; exit 2; }
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
          printf 'VIDEO_URL=%s\n' "$URL" >> "$GITHUB_ENV"
          mkdir -p fetched

      - name: Primary cloud fetch through Apify
        id: apify
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APIFY_TOKEN:-}" ]]; then
            echo 'Apify cloud fetch: NOT CONFIGURED (missing APIFY_TOKEN secret)' |
              tee -a fetched/download.log
            exit 0
          fi

          echo '=== attempt: apify-residential-cloud ===' | tee -a fetched/download.log

          python - <<'PY'
          import json, os
          payload = {
              'urls': [os.environ['VIDEO_URL']],
              'quality': '720',
              'audioOnly': False,
              'subtitles': True,
              'subLangs': 'en',
              'includeMetadata': True,
              # Cost/safety ceiling. Typical Shorts are only a few MB.
              'maxMegabytes': 150,
              'proxyConfiguration': {
                  'useApifyProxy': True,
                  'apifyProxyGroups': ['RESIDENTIAL'],
              },
          }
          with open('fetched/apify-input.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          PY

          status=0
          curl --fail-with-body --silent --show-error --location \
            --max-time 330 \
            --header "Authorization: Bearer $APIFY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @fetched/apify-input.json \
            'https://api.apify.com/v2/acts/dami_studio~youtube-video-downloader/run-sync-get-dataset-items?timeout=300' \
            > fetched/apify-response.json || status=$?

          rm -f fetched/apify-input.json

          if [[ "$status" != 0 ]]; then
            echo "Apify request failed with curl status $status" | tee -a fetched/download.log
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('fetched/apify-response.json')
          try:
              data = json.loads(p.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'Invalid Apify JSON: {exc}')
              raise SystemExit(0)
          row = data[0] if isinstance(data, list) and data else {}
          media = row.get('mediaUrl') or row.get('download_url') or row.get('downloadUrl') or ''
          if media:
              Path('fetched/apify-media-url.txt').write_text(media, encoding='utf-8')
          print('Apify dataset row received:', bool(row), 'media URL:', bool(media))
          PY

          if [[ ! -s fetched/apify-media-url.txt ]]; then
            echo 'Apify actor returned no downloadable media URL.' | tee -a fetched/download.log
            exit 0
          fi

          MEDIA_URL="$(cat fetched/apify-media-url.txt)"
          if curl --fail --silent --show-error --location --max-time 300 \
              "$MEDIA_URL" -o fetched/source.mp4; then
            echo 'APIFY_FETCHED=1' >> "$GITHUB_ENV"
            echo 'Apify cloud fetch succeeded.' | tee -a fetched/download.log
          else
            rm -f fetched/source.mp4
            echo 'Apify media download failed; continuing to cloud fallbacks.' |
              tee -a fetched/download.log
          fi
          rm -f fetched/apify-media-url.txt

      - name: Install fallback fetch stack
        if: env.APIFY_FETCHED != '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'yt-dlp[default,curl-cffi]==2026.7.4'
          yt-dlp --version
          node --version || true

      - name: Cloud fallback fetches
        if: env.APIFY_FETCHED != '1'
        shell: bash
        run: |
          set -euo pipefail

          common=(
            --no-playlist
            --write-info-json
            --write-description
            --write-thumbnail
            --write-subs
            --write-auto-subs
            --sub-langs 'en.*,en'
            --sub-format 'vtt/best'
            --js-runtimes node
            -f '18/best[ext=mp4][acodec!=none][vcodec!=none]/best[acodec!=none][vcodec!=none]'
            -o 'fetched/source.%(ext)s'
          )

          attempt() {
            local label="$1"
            shift
            echo "=== attempt: $label ===" | tee -a fetched/download.log
            rm -f fetched/source.part fetched/source.ytdl
            yt-dlp "${common[@]}" "$@" "$VIDEO_URL" 2>&1 | tee -a fetched/download.log
          }

          is_youtube=0
          if [[ "$VIDEO_URL" == *youtube.com* || "$VIDEO_URL" == *youtu.be* ]]; then
            is_youtube=1
          fi

          # Secondary cloud reliability boundary: residential/ISP proxy egress.
          if [[ "$is_youtube" == 1 && -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
            echo 'Secondary residential cloud egress: configured' | tee -a fetched/download.log
            attempt residential-default \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome && exit 0
            attempt residential-mweb \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome \
              --extractor-args 'youtube:player_client=mweb' && exit 0
            attempt residential-web-safari \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --extractor-args 'youtube:player_client=web_safari' && exit 0
          elif [[ "$is_youtube" == 1 ]]; then
            echo 'Secondary residential cloud egress: NOT CONFIGURED' |
              tee -a fetched/download.log
          fi

          # Optional cookies remain cloud-side and only ride through residential egress.
          if [[ "$is_youtube" == 1 && -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" && -n "${YOUTUBE_COOKIES_B64:-}" ]]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > fetched/youtube-cookies.txt
            chmod 600 fetched/youtube-cookies.txt
            if attempt residential-cookies \
                --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
                --impersonate chrome \
                --cookies fetched/youtube-cookies.txt; then
              rm -f fetched/youtube-cookies.txt
              exit 0
            fi
            rm -f fetched/youtube-cookies.txt
          fi

          # Free/best-effort routes. These are useful but not treated as the
          # production reliability boundary.
          attempt direct && exit 0

          if [[ "$is_youtube" == 1 ]]; then
            echo '=== attempt: federated-piped-invidious ===' | tee -a fetched/download.log
            if python tools/reference_video_fallback.py "$VIDEO_URL" --output fetched 2>&1 |
                tee -a fetched/download.log; then
              exit 0
            fi
          fi

          # Last free fallback: PO-token provider. Media requests still use the
          # residential proxy when one is configured.
          if [[ "$is_youtube" == 1 ]]; then
            python -m pip install --disable-pip-version-check 'bgutil-ytdlp-pot-provider==1.3.1'
            docker run -d --name bgutil-provider -p 4416:4416 --init \
              brainicism/bgutil-ytdlp-pot-provider:1.3.1

            ready=0
            for i in {1..90}; do
              if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done

            if [[ "$ready" == 1 ]]; then
              if [[ -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
                attempt po-residential \
                  --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
                  --impersonate chrome && exit 0
              else
                attempt po-direct && exit 0
              fi
            else
              docker logs bgutil-provider || true
              echo 'PO-token provider failed to start' | tee -a fetched/download.log
            fi
          fi

          rm -f fetched/youtube-cookies.txt
          echo 'All cloud fetch strategies failed.' | tee -a fetched/download.log >&2
          if [[ "$is_youtube" == 1 && -z "${APIFY_TOKEN:-}" && -z "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
            echo 'BLOCKER=no production cloud egress credential is configured (APIFY_TOKEN or VIDEO_RESIDENTIAL_PROXY_URL).' |
              tee -a fetched/download.log >&2
          fi
          exit 4

      - name: Build fetch manifest
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find fetched -maxdepth 1 -type f -name 'source.*' \
            ! -name '*.json' ! -name '*.description' ! -name '*.vtt' \
            ! -name '*.webp' ! -name '*.jpg' ! -name '*.txt' | head -1)"
          [[ -n "$VIDEO" ]] || { echo 'No source video found' >&2; exit 5; }
          python - <<PY
          import hashlib, json, os
          from pathlib import Path
          video=Path('$VIDEO')
          h=hashlib.sha256(video.read_bytes()).hexdigest()
          vtts=sorted(str(p.name) for p in Path('fetched').glob('*.vtt'))
          manifest={
              'source_url': os.environ['VIDEO_URL'],
              'source_file': video.name,
              'source_sha256': h,
              'fetch_path': 'apify-cloud' if os.environ.get('APIFY_FETCHED') == '1' else 'github-cloud-fallback',
              'apify_configured': bool(os.environ.get('APIFY_TOKEN')),
              'secondary_residential_proxy_configured': bool(os.environ.get('VIDEO_RESIDENTIAL_PROXY_URL')),
              'yt_dlp_version': '2026.07.04',
              'captions': vtts,
          }
          Path('fetched/fetch-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          rm -f fetched/youtube-cookies.txt

      - name: Upload fetched source
        uses: actions/upload-artifact@v4
        with:
          name: video-fetch-${{ github.run_id }}
          path: fetched/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-fetch-diagnostics-${{ github.run_id }}
          path: fetched/download.log
          if-no-files-found: ignore
          retention-days: 2
