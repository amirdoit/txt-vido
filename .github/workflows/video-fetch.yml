name: Video Fetch Worker

on:
  pull_request:
    paths:
      - '.video-fetch/request.json'
  workflow_dispatch:
    inputs:
      url:
        description: 'Public video URL to fetch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch-video:
    # This repository is public. Only Amir's same-repo intake branches may receive
    # the cloud proxy secret. Fork PRs are never allowed to run the trusted path.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'amirdoit')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Vendor-neutral secret. Initial recommended provider: Decodo residential.
      # Example shape only; never commit the real value:
      # http://user-...-session-videointake-sessionduration-30:PASSWORD@gate.decodo.com:7000
      VIDEO_RESIDENTIAL_PROXY_URL: ${{ secrets.VIDEO_RESIDENTIAL_PROXY_URL }}
      # Optional secondary fallback for edge cases that genuinely require login.
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

    steps:
      - name: Check out trusted request branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve request
        id: request
        shell: bash
        env:
          DISPATCH_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_URL:-}" ]]; then
            URL="$DISPATCH_URL"
          else
            URL="$(python - <<'PY'
          import json
          print(json.load(open('.video-fetch/request.json'))['url'])
          PY
          )"
          fi
          [[ "$URL" =~ ^https?:// ]] || { echo 'Refusing non-HTTP(S) URL' >&2; exit 2; }
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
          printf 'VIDEO_URL=%s\n' "$URL" >> "$GITHUB_ENV"

      - name: Install cloud fetch stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'yt-dlp[default,curl-cffi]==2026.7.4'
          yt-dlp --version
          node --version || true

      - name: Fetch video and captions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fetched

          common=(
            --no-playlist
            --write-info-json
            --write-description
            --write-thumbnail
            --write-subs
            --write-auto-subs
            --sub-langs 'en.*,en'
            --sub-format 'vtt/best'
            --js-runtimes node
            -f '18/best[ext=mp4][acodec!=none][vcodec!=none]/best[acodec!=none][vcodec!=none]'
            -o 'fetched/source.%(ext)s'
          )

          attempt() {
            local label="$1"
            shift
            echo "=== attempt: $label ===" | tee -a fetched/download.log
            rm -f fetched/source.part fetched/source.ytdl
            yt-dlp "${common[@]}" "$@" "$VIDEO_URL" 2>&1 | tee -a fetched/download.log
          }

          is_youtube=0
          if [[ "$VIDEO_URL" == *youtube.com* || "$VIDEO_URL" == *youtu.be* ]]; then
            is_youtube=1
          fi

          # Tier 1 for YouTube: cloud compute + residential egress. A sticky session
          # keeps extraction and media requests on the same residential IP.
          if [[ "$is_youtube" == 1 && -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
            echo 'Residential cloud egress: configured' | tee -a fetched/download.log
            attempt residential-default \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome && exit 0
            attempt residential-mweb \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome \
              --extractor-args 'youtube:player_client=mweb' && exit 0
            attempt residential-web-safari \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --extractor-args 'youtube:player_client=web_safari' && exit 0
            attempt residential-web-embedded \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome \
              --extractor-args 'youtube:player_client=web_embedded' && exit 0
          elif [[ "$is_youtube" == 1 ]]; then
            echo 'Residential cloud egress: NOT CONFIGURED (missing VIDEO_RESIDENTIAL_PROXY_URL secret)' |
              tee -a fetched/download.log
          fi

          # Tier 2: authenticated cloud fetch through the same residential egress.
          # This is optional and should not be required for normal public Shorts.
          if [[ "$is_youtube" == 1 && -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" && -n "${YOUTUBE_COOKIES_B64:-}" ]]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > fetched/youtube-cookies.txt
            chmod 600 fetched/youtube-cookies.txt
            if attempt residential-cookies \
              --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
              --impersonate chrome \
              --cookies fetched/youtube-cookies.txt; then
              rm -f fetched/youtube-cookies.txt
              exit 0
            fi
            rm -f fetched/youtube-cookies.txt
          fi

          # Tier 3: ordinary public path. Useful for non-YouTube services and for
          # YouTube when a hosted runner is not currently challenged.
          attempt direct && exit 0

          # Tier 4: independent public frontends. Free best-effort fallback only.
          if [[ "$is_youtube" == 1 ]]; then
            echo '=== attempt: federated-piped-invidious ===' | tee -a fetched/download.log
            if python tools/reference_video_fallback.py "$VIDEO_URL" --output fetched 2>&1 |
              tee -a fetched/download.log; then
              exit 0
            fi
          fi

          # Tier 5: PO-token provider. When residential egress is configured, the
          # actual media extraction still leaves through that proxy.
          if [[ "$is_youtube" == 1 ]]; then
            python -m pip install --disable-pip-version-check 'bgutil-ytdlp-pot-provider==1.3.1'
            docker run -d --name bgutil-provider -p 4416:4416 --init \
              brainicism/bgutil-ytdlp-pot-provider:1.3.1

            ready=0
            for i in {1..90}; do
              if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done

            if [[ "$ready" == 1 ]]; then
              if [[ -n "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
                attempt po-residential \
                  --proxy "$VIDEO_RESIDENTIAL_PROXY_URL" \
                  --impersonate chrome && exit 0
              else
                attempt po-direct && exit 0
              fi
            else
              docker logs bgutil-provider || true
              echo 'PO-token provider failed to start' | tee -a fetched/download.log
            fi
          fi

          rm -f fetched/youtube-cookies.txt
          echo 'All cloud fetch strategies failed.' | tee -a fetched/download.log >&2
          if [[ "$is_youtube" == 1 && -z "${VIDEO_RESIDENTIAL_PROXY_URL:-}" ]]; then
            echo 'BLOCKER=VIDEO_RESIDENTIAL_PROXY_URL secret is not configured.' |
              tee -a fetched/download.log >&2
          fi
          exit 4

      - name: Build fetch manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find fetched -maxdepth 1 -type f -name 'source.*' \
            ! -name '*.json' ! -name '*.description' ! -name '*.vtt' \
            ! -name '*.webp' ! -name '*.jpg' ! -name '*.txt' | head -1)"
          [[ -n "$VIDEO" ]] || { echo 'No source video found' >&2; exit 5; }
          python - <<PY
          import hashlib, json
          from pathlib import Path
          video=Path('$VIDEO')
          h=hashlib.sha256(video.read_bytes()).hexdigest()
          vtts=sorted(str(p.name) for p in Path('fetched').glob('*.vtt'))
          manifest={
              'source_url': '''$VIDEO_URL''',
              'source_file': video.name,
              'source_sha256': h,
              'fetch_path': 'cloud',
              'residential_proxy_configured': bool('''${VIDEO_RESIDENTIAL_PROXY_URL:+yes}'''),
              'yt_dlp_version': '2026.07.04',
              'captions': vtts,
          }
          Path('fetched/fetch-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          rm -f fetched/youtube-cookies.txt

      - name: Upload fetched source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-fetch-${{ github.run_id }}
          path: fetched/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-fetch-diagnostics-${{ github.run_id }}
          path: fetched/download.log
          if-no-files-found: ignore
          retention-days: 2
