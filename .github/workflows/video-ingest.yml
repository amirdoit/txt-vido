name: Video Intake Worker

on:
  push:
    paths:
      - '.video-ingest/request.json'
  pull_request:
    paths:
      - '.video-ingest/request.json'
  workflow_dispatch:
    inputs:
      url:
        description: 'Public video URL to ingest'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: video-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve request
        id: request
        shell: bash
        env:
          DISPATCH_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_URL:-}" ]]; then
            URL="$DISPATCH_URL"
          else
            URL="$(jq -r '.url // empty' .video-ingest/request.json)"
          fi
          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "Refusing non-HTTP(S) input URL" >&2
            exit 2
          fi
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
          printf 'VIDEO_URL=%s\n' "$URL" >> "$GITHUB_ENV"

      - name: Install video intake stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install \
            'yt-dlp[default]==2026.7.4' \
            'bgutil-ytdlp-pot-provider==1.3.1' \
            'faster-whisper==1.2.1'
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Start YouTube PO-token provider
        if: contains(steps.request.outputs.url, 'youtube.com') || contains(steps.request.outputs.url, 'youtu.be')
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bgutil-provider -p 4416:4416 --init \
            brainicism/bgutil-ytdlp-pot-provider:1.3.1
          # The provider can take >30s on a cold runner. Check the TCP socket,
          # not the HTTP root status code, because the root route need not be 2xx.
          for i in {1..90}; do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then
              echo 'PO-token provider is accepting connections'
              exit 0
            fi
            sleep 1
          done
          docker logs bgutil-provider || true
          echo 'PO-token provider did not become ready' >&2
          exit 3

      - name: Download source video with fallbacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ingest/frames ingest/scene-cuts ingest/subtitles

          common=(
            --no-playlist
            --write-info-json
            --write-description
            --write-thumbnail
            --write-subs
            --write-auto-subs
            --sub-langs 'en.*,en'
            --convert-subs srt
            --merge-output-format mp4
            -S 'res:1080,fps,vcodec:h264,acodec:aac'
            -o 'ingest/source.%(ext)s'
          )

          try_download() {
            local label="$1"
            shift
            echo "=== yt-dlp attempt: $label ===" | tee -a ingest/download.log
            rm -f ingest/source.part ingest/source.ytdl
            if yt-dlp "${common[@]}" "$@" "$VIDEO_URL" 2>&1 | tee -a ingest/download.log; then
              return 0
            fi
            return 1
          }

          if try_download default; then
            exit 0
          fi

          if [[ "$VIDEO_URL" == *youtube.com* || "$VIDEO_URL" == *youtu.be* ]]; then
            try_download youtube-mweb --extractor-args 'youtube:player_client=mweb' && exit 0
            try_download youtube-web-safari --extractor-args 'youtube:player_client=web_safari' && exit 0
            try_download youtube-web-embedded --extractor-args 'youtube:player_client=web_embedded' && exit 0
          fi

          echo 'All download strategies failed.' >&2
          exit 4

      - name: Normalize and extract visual evidence
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find ingest -maxdepth 1 -type f \( -name 'source.mp4' -o -name 'source.webm' -o -name 'source.mkv' -o -name 'source.mov' \) | head -1)"
          if [[ -z "$VIDEO" ]]; then
            echo 'No downloaded video found' >&2
            find ingest -maxdepth 2 -type f -print >&2 || true
            exit 5
          fi

          if [[ "$VIDEO" != 'ingest/source.mp4' ]]; then
            ffmpeg -hide_banner -loglevel error -y -i "$VIDEO" \
              -map 0:v:0 -map 0:a? -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
              -c:a aac -b:a 192k -movflags +faststart ingest/source.mp4
          fi

          ffprobe -v quiet -print_format json -show_format -show_streams ingest/source.mp4 > ingest/probe.json
          ffmpeg -hide_banner -loglevel error -y -i ingest/source.mp4 -vn -ac 1 -ar 16000 ingest/audio.wav

          ffmpeg -hide_banner -loglevel error -y -i ingest/source.mp4 \
            -vf "fps=1,scale='min(720,iw)':-2" -q:v 3 ingest/frames/frame_%04d.jpg

          ffmpeg -hide_banner -loglevel error -y -i ingest/source.mp4 \
            -vf "select='gt(scene,0.22)',scale='min(720,iw)':-2" -fps_mode vfr -q:v 2 \
            ingest/scene-cuts/cut_%04d.jpg || true

          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          probe = json.loads(Path('ingest/probe.json').read_text())
          duration = float(probe.get('format', {}).get('duration') or 0)
          interval = max(duration / 20.0, 0.20) if duration else 1.0
          vf = f"fps=1/{interval},scale=320:-2,tile=5x4"
          subprocess.run([
              'ffmpeg','-hide_banner','-loglevel','error','-y','-i','ingest/source.mp4',
              '-vf',vf,'-frames:v','1','ingest/contact-sheet.jpg'
          ], check=False)
          PY

      - name: Choose subtitles or transcribe locally
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          srts=(ingest/*.srt ingest/subtitles/*.srt)
          if (( ${#srts[@]} > 0 )); then
            cp "${srts[0]}" ingest/transcript.srt
            python - <<'PY'
          import re
          from pathlib import Path
          p = Path('ingest/transcript.srt')
          text = p.read_text(errors='replace')
          lines=[]
          for line in text.splitlines():
              if not line.strip() or line.strip().isdigit() or '-->' in line:
                  continue
              line = re.sub(r'<[^>]+>', '', line).strip()
              if line and (not lines or lines[-1] != line):
                  lines.append(line)
          Path('ingest/transcript.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
          else
            echo 'No usable platform subtitles; running faster-whisper base model.'
            python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel

          model = WhisperModel('base', device='cpu', compute_type='int8')
          segments, info = model.transcribe('ingest/audio.wav', beam_size=5, vad_filter=True)
          segments = list(segments)

          def ts(value):
              ms = int(round(value * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              s, ms = divmod(ms, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          srt=[]
          plain=[]
          timed=[]
          for i, seg in enumerate(segments, 1):
              text = seg.text.strip()
              if not text:
                  continue
              srt += [str(i), f'{ts(seg.start)} --> {ts(seg.end)}', text, '']
              plain.append(text)
              timed.append(f'[{seg.start:07.2f}-{seg.end:07.2f}] {text}')
          Path('ingest/transcript.srt').write_text('\n'.join(srt), encoding='utf-8')
          Path('ingest/transcript.txt').write_text('\n'.join(plain), encoding='utf-8')
          Path('ingest/transcript-timed.txt').write_text('\n'.join(timed), encoding='utf-8')
          Path('ingest/transcript-language.txt').write_text(
              f'language={info.language}\nprobability={info.language_probability:.4f}\n',
              encoding='utf-8'
          )
          PY
          fi

      - name: Build intake manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum ingest/source.mp4 | awk '{print $1}')"
          python - <<PY
          import json
          from pathlib import Path
          manifest = {
            'source_url': '''$VIDEO_URL''',
            'source_sha256': '$SHA',
            'yt_dlp_version': '2026.07.04',
            'po_token_provider': 'bgutil-ytdlp-pot-provider 1.3.1',
            'visual_frames': len(list(Path('ingest/frames').glob('*.jpg'))),
            'scene_cut_frames': len(list(Path('ingest/scene-cuts').glob('*.jpg'))),
            'transcript': Path('ingest/transcript.srt').exists(),
          }
          Path('ingest/intake-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          find ingest -maxdepth 2 -type f -printf '%p\t%k KB\n' | sort > ingest/files.txt

      - name: Upload intake artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-intake-${{ github.run_id }}
          path: ingest/
          if-no-files-found: error
          retention-days: 7
